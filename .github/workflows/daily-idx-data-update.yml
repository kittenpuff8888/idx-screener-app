name: Daily IDX Data Update

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional market date (YYYY-MM-DD). Empty uses latest completed session."
        required: false
        type: string
      run_backfill:
        description: "Rebuild 2025-01-01 through 2026-06-10 from stored real OHLCV sessions."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 9 * * 1-5"   # 16:30 WIB - just after market close
    - cron: "0 10 * * 1-5"   # 17:00 WIB - 5 PM daily refresh
    - cron: "30 10 * * 1-5"  # 17:30 WIB - post-close retry
    - cron: "30 11 * * 1-5"  # 18:30 WIB - post-close retry

permissions:
  contents: write

concurrency:
  group: daily-idx-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill historical archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_backfill }}
        # Additive (no --clean) so it can never delete existing snapshots.
        # KNOWN LIMITATION: build_archive rebuilds the manifest only for dates in
        # its frozen source (DEFAULT_SOURCE_DATE=2026-06-10), so running this drops
        # dates the daily pipeline added after that from the manifest and the tests
        # (correctly) block the commit. Extending history needs build_archive to
        # MERGE the existing manifest first. Left additive/safe; not functional yet.
        run: python scripts/backfill_history.py --start 2023-08-18 --end 2026-12-31

      - name: Update daily IDX data
        id: daily_update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_backfill) }}
        continue-on-error: true
        shell: bash
        run: |
          args=(--timezone Asia/Jakarta --market-close-time 16:30 --session-ready-time 17:00)
          if [ -n "${{ inputs.market_date }}" ]; then
            args+=(--market-date "${{ inputs.market_date }}")
          fi
          python scripts/update_daily.py "${args[@]}"

      - name: Commit failure log
        if: ${{ steps.daily_update.outcome == 'failure' }}
        shell: bash
        run: |
          git config user.name "idx-data-bot"
          git config user.email "idx-data-bot@users.noreply.github.com"
          git add docs/data/update-log.json
          git diff --cached --quiet || git commit -m "Log failed IDX data update"
          # Retry on rejection: main may have moved while this run was working.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (main moved); rebasing, attempt ${attempt}"
            # The bot only commits regenerated data (docs/data, docs/downloads,
            # data_sources), so any rebase conflict is a regenerated file (e.g.
            # update-log.json) where this run's fresh version should win. -X theirs
            # keeps our replayed commit's version; abort cleanly if it still can't.
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
          done
          git push

      - name: Stop after failed update
        if: ${{ steps.daily_update.outcome == 'failure' }}
        run: |
          echo "Daily update failed. See the update log and the failed stage above."
          exit 1

      - name: Validate generated archive
        run: |
          python scripts/export_ksei_ownership.py
          python scripts/build_custom_indexes.py
          python scripts/audit_universe.py
          python scripts/parity_check.py
          python scripts/build_swing_setups.py
          python scripts/validate_data.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript
        run: |
          node --check docs/app.js
          node --check docs/indicators.js
          node --check docs/chart/indicator-engine/math.js
          node --check docs/chart/indicator-engine/overlays.js
          node --check docs/chart/indicator-engine/momentum.js
          node tests/indicator_engine.test.js

      - name: Commit generated data if changed
        shell: bash
        run: |
          git config user.name "idx-data-bot"
          git config user.email "idx-data-bot@users.noreply.github.com"
          git add docs/data docs/downloads data_sources
          if git diff --cached --quiet; then
            echo "No generated data changes. Last successful snapshot remains active."
            exit 0
          fi
          git commit -m "Update IDX data snapshot"
          # A run takes up to 3 hours. Any push to main in that window makes this
          # push non-fast-forward, and a bare `git push` would fail the job and
          # discard a full day of generated data. Rebase and retry instead.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (main moved); rebasing, attempt ${attempt}"
            # The bot only commits regenerated data (docs/data, docs/downloads,
            # data_sources), so any rebase conflict is a regenerated file (e.g.
            # update-log.json) where this run's fresh version should win. -X theirs
            # keeps our replayed commit's version; abort cleanly if it still can't.
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null || true; exit 1; }
          done
          echo "push still failing after 3 attempts"
          exit 1
