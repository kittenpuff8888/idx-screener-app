name: Deploy Next.js Static Export to GitHub Pages

on:
  push:
    branches: [main]
  # GitHub does not start workflows from pushes made with the default
  # GITHUB_TOKEN, so idx-data-bot's data commits never fire the `push` trigger
  # above. Without this, a snapshot committed after the 10:30 UTC cron sat
  # unpublished until the next weekday run -- on 2026-07-23 that was ~20 hours.
  workflow_run:
    workflows: ["Daily IDX Data Update"]
    types: [completed]
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Live quote overlay endpoint (public URL, not a secret). Inlined into the
  # static build; if unset, fetchLive() no-ops and the UI uses archived closes.
  NEXT_PUBLIC_LIVE_ENDPOINT: ${{ vars.LIVE_ENDPOINT || 'https://idx-live-quotes.vercel.app/api/live' }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only publish when the data run actually succeeded. A failed or cancelled
    # run must not trigger a deploy of unchanged or partial data.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated data
        run: python scripts/validate_data.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build static site
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
