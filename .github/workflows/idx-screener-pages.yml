name: IDX Screener Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      market_date:
        description: "Optional single market date, format YYYY-MM-DD. Leave blank to backfill."
        required: false
        type: string
      backfill_days:
        description: "When market_date is blank, run the last N market weekdays."
        required: false
        default: "7"
        type: string
  schedule:
    # Retry at 17:00, 19:00, and 21:00 WIB because GitHub cron can start late
    # or occasionally miss a scheduled event. Existing dates are skipped.
    - cron: "0 10,12,14 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve screener run arguments
        id: screener-args
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --quiet HEAD^ HEAD -- rebuild_backend/IDX_Screener.py; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "args=" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "args=--rebuild-published" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "${{ inputs.market_date }}" ]; then
            if ! [[ "${{ inputs.market_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "market_date must use YYYY-MM-DD"
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--date ${{ inputs.market_date }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--days 1 --skip-existing" >> "$GITHUB_OUTPUT"
          else
            days="${{ inputs.backfill_days }}"
            if [ -z "$days" ]; then
              days="7"
            fi
            if ! [[ "$days" =~ ^[0-9]+$ ]]; then
              echo "backfill_days must be a number"
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "args=--days $days" >> "$GITHUB_OUTPUT"
          fi

      - name: Run screener and export site data
        if: steps.screener-args.outputs.run == 'true'
        run: python scripts/run_backfill.py ${{ steps.screener-args.outputs.args }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit generated data
        if: steps.screener-args.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/downloads
          git diff --cached --quiet || git commit -m "Update IDX screener data"
          git push
